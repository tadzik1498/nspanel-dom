# =====================================================================
#  NSPanel Dom - dynamiczny panel domu dla Sonoff NSPanel EU (ESPHome)
#  v1.14 - G13: zamiast paska dnia trzeci (zewnetrzny) pierscien = tarcza 24 h ze strefami,
#          znacznikami godzin, cyframi 0/6/12/18 i wskazowka "teraz"
#  v1.13 - czytelnosc dla seniora: G13 z gruba ramka w kolorze strefy, duze wartosci,
#          znaczniki godzin na pasku dnia; Dom: pelny domek z gruba obwodka, dwa
#          ujednolicone rozmiary wartosci; korytarz: zgas po 30 s (domyslnie)
#  v1.12 - kafelki G13 i Dom na tle nieba spojnym z pogoda (pasma wg pogody i pory dnia),
#          tekst przezroczysty z cieniem jak na kafelku pogody
#  v1.11 - kafelek "Dom" (domek: temp. na dachu, w domu, klima, moc; typ V z opcja dom,
#          encja sensor.panel_dom_dane, dotkniecie = sterowanie klimatyzacja)
#  v1.10 - kafelek "Prad G13" (typ V z opcja g13, encja sensor.nspanel_g13_data),
#          kolejka komend Nextion 800, odswiezanie kafelkow V co minute
#  v1.9 - odliczanie w oknie ({s} w tresci), okno przy wlaczeniu swiatla na korytarzu
#
#  Idea:
#   - wykrywanie encji i sugestie robi Home Assistant (pakiet
#     nspanel_dom_ha.yaml), panel dostaje gotowy katalog
#     pomieszczen -> encji przez akcje API (begin/area/done/state)
#   - nic nie jest wkompilowane na sztywno: zmiana pomieszczen,
#     nowe encje, zmiana przypisan = bez ponownego flashowania
#   - wybor encji (sugerowane / dodane / ukryte) i przeniesienie
#     encji do innego pomieszczenia robi sie NA PANELU (Edytuj),
#     zapis w pamieci flash panelu
#   - UI rysowane z ESP prymitywami Nextion (fill/xstr/cirs),
#     TFT zawiera tylko jedna pusta strone + 4 fonty + kod dotyku
#
#  TFT (jednorazowo, Nextion Editor, Windows):
#   1. New project, model NX4832F035_011, kierunek Horizontal 0 (480x320)
#   2. Tools > Font Generator, kodowanie iso-8859-2, dodaj w kolejnosci:
#        font 0: 16 px, font 1: 24 px, font 2: 32 px,
#        font 3: 56 px bold (Arial Bold - liczby w kafelkach),
#        font 4: 72 px bold (Arial Bold - zegar i temp. zewnetrzna)
#   3. page0: bez komponentow, sta = solid color, bco = 2146
#   4. page0 > Touch Press Event:
#        sys0=tch0/30
#        sys1=tch1/20
#        sys2=sys1*16
#        sys2+=sys0
#        printh 65 00
#        prints sys2,1
#        printh 01 ff ff ff
#   5. page0 > Touch Release Event:
#        printh 65 00 00 00 ff ff ff
#   6. File > TFT file output -> nspanel_dom.tft
#      skopiuj do HA: /config/www/nspanel/nspanel_dom.tft
#   7. Po wgraniu tego firmware: w HA przycisk "Wgraj TFT"
#
#  Siatka dotyku: 16 kolumn x 16 wierszy (30 x 20 px), numer komorki
#  przychodzi jako component_id w zdarzeniu on_touch.
#
#  W HA: Ustawienia > Urzadzenia > ESPHome > NSPanel Dom > Konfiguruj
#  -> zaznacz "Allow the device to perform Home Assistant actions".
# =====================================================================

substitutions:
  name: nspanel-dom
  # uklad startowy ekranu glownego (ten sam co domyslny w HA); zastepuje go uklad z edytora
  e_temp_dom: sensor.YOUR_INDOOR_TEMPERATURE
  e_klima: climate.YOUR_CLIMATE
  e_moc: sensor.YOUR_POWER_W
  moc_max: "2700"
  e_temp_dach: sensor.YOUR_OUTDOOR_TEMPERATURE
  friendly: NSPanel Dom
  # TFT z HA (/config/www/nspanel/) albo z PC: w folderze z plikiem
  # uruchom "python -m http.server 8000" i uzyj http://<PC-IP>:8000/nspanel_dom.tft
  tft_url: http://homeassistant.local:8123/local/nspanel/nspanel_dom.tft

esphome:
  name: ${name}
  friendly_name: ${friendly}
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            // ---------------- palette (RGB565) ----------------
            // BG 2146  BAR 6372  TILE 10599  TXT 61278  DIM 35988
            // DARK 4226  AMBER 64900  TEAL 11828  ORANGE 64359
            // BLUE 17599  PURPLE 37919  RED 60042  GREEN 17997  BTN 14858

            // ---------------- basic helpers ----------------
            id(f_hash) = [](const std::string &s) -> uint32_t {
              uint32_t h = 2166136261u;
              for (unsigned char c : s) { h ^= c; h *= 16777619u; }
              h &= 0x7FFFFFFFu;
              return h ? h : 1u;
            };

            // UTF-8 -> ISO-8859-2 (fonts in TFT), quote-safe, length-capped
            id(f_txt) = [](const std::string &s, size_t maxlen) -> std::string {
              static const char keep[] = "\xA0\xA4\xA7\xA8\xAD\xB0\xB4\xB8\xC1\xC2\xC4\xC7\xC9\xCB\xCD\xCE\xD3\xD4\xD6\xD7\xDA\xDC\xDD\xDF\xE1\xE2\xE4\xE7\xE9\xEB\xED\xEE\xF3\xF4\xF6\xF7\xFA\xFC\xFD";
              std::string o;
              size_t i = 0;
              while (i < s.size() && o.size() < maxlen) {
                uint8_t c = (uint8_t) s[i];
                uint32_t cp;
                size_t n;
                if (c < 0x80) { cp = c; n = 1; }
                else if ((c & 0xE0) == 0xC0 && i + 1 < s.size()) { cp = ((c & 0x1F) << 6) | ((uint8_t) s[i + 1] & 0x3F); n = 2; }
                else if ((c & 0xF0) == 0xE0 && i + 2 < s.size()) { cp = ((c & 0x0F) << 12) | (((uint8_t) s[i + 1] & 0x3F) << 6) | ((uint8_t) s[i + 2] & 0x3F); n = 3; }
                else if ((c & 0xF8) == 0xF0 && i + 3 < s.size()) { cp = 0xFFFF; n = 4; }
                else { cp = '?'; n = 1; }
                i += n;
                char r = '?';
                if (cp == '"') r = '\'';
                else if (cp == '\\') r = '/';
                else if (cp < 0x20) r = ' ';
                else if (cp < 0x7F) r = (char) cp;
                else {
                  switch (cp) {
                    case 0x104: r = '\xA1'; break;  case 0x105: r = '\xB1'; break;
                    case 0x106: r = '\xC6'; break;  case 0x107: r = '\xE6'; break;
                    case 0x118: r = '\xCA'; break;  case 0x119: r = '\xEA'; break;
                    case 0x141: r = '\xA3'; break;  case 0x142: r = '\xB3'; break;
                    case 0x143: r = '\xD1'; break;  case 0x144: r = '\xF1'; break;
                    case 0x15A: r = '\xA6'; break;  case 0x15B: r = '\xB6'; break;
                    case 0x179: r = '\xAC'; break;  case 0x17A: r = '\xBC'; break;
                    case 0x17B: r = '\xAF'; break;  case 0x17C: r = '\xBF'; break;
                    case 0x2013: case 0x2014: r = '-'; break;
                    default:
                      if (cp >= 0xA0 && cp <= 0xFF && strchr(keep, (char) cp) != nullptr) r = (char) cp;
                  }
                }
                o += r;
              }
              return o;
            };

            // count UTF-8 code points
            id(f_len) = [](const std::string &s) -> int {
              int n = 0;
              for (unsigned char c : s) if ((c & 0xC0) != 0x80) n++;
              return n;
            };

            // split name into two lines of max maxc characters
            id(f_split) = [](const std::string &s, int maxc, std::string &l1, std::string &l2) {
              std::vector<size_t> pos;
              for (size_t i = 0; i < s.size(); i++) if (((uint8_t) s[i] & 0xC0) != 0x80) pos.push_back(i);
              int n = pos.size();
              if (n <= maxc) { l1 = s; l2 = ""; return; }
              int cut = -1;
              for (int k = maxc; k > 0; k--) if (s[pos[k]] == ' ') { cut = k; break; }
              if (cut < 0) cut = maxc;
              l1 = s.substr(0, pos[cut]);
              std::string rest = s.substr(pos[cut]);
              while (!rest.empty() && rest[0] == ' ') rest.erase(0, 1);
              std::vector<size_t> p2;
              for (size_t i = 0; i < rest.size(); i++) if (((uint8_t) rest[i] & 0xC0) != 0x80) p2.push_back(i);
              if ((int) p2.size() > maxc) rest = rest.substr(0, p2[maxc - 1]) + ".";
              l2 = rest;
            };

            // n-th field of "a/b/c"
            id(f_part) = [](const std::string &s, int n) -> std::string {
              size_t st = 0;
              for (int k = 0; k < n; k++) {
                size_t p = s.find('/', st);
                if (p == std::string::npos) return "";
                st = p + 1;
              }
              size_t e = s.find('/', st);
              return s.substr(st, e == std::string::npos ? std::string::npos : e - st);
            };

            // number formatting: 21.537 -> 21.5, 1234.5 -> 1235
            id(f_fmt) = [](const std::string &s) -> std::string {
              if (s.empty() || s.find('.') == std::string::npos) return s;
              char *end = nullptr;
              float v = strtof(s.c_str(), &end);
              if (end == s.c_str() || *end != 0) return s;
              char b[24];
              if (fabsf(v) >= 100.0f) snprintf(b, sizeof(b), "%.0f", v);
              else snprintf(b, sizeof(b), "%.1f", v);
              return std::string(b);
            };

            // ---------------- drawing primitives (paced queue) ----------------
            // logical x (0..480) -> physical x (0..p_uiw): keeps the UI inside the visible glass area
            id(f_sx) = [](int x) -> int { return x * id(p_uiw) / 480; };
            id(f_cmd) = [](const std::string &c) {
              if (id(q_cmd).size() < 800) id(q_cmd).push_back(c);
            };
            id(f_fill) = [](int x, int y, int w, int h, int c) {
              char b[48];
              int px = id(f_sx)(x), pw = id(f_sx)(x + w) - px;
              snprintf(b, sizeof(b), "fill %d,%d,%d,%d,%d", px, y, pw, h, c);
              id(f_cmd)(b);
            };
            id(f_circ) = [](int x, int y, int r, int c) {
              char b[40];
              snprintf(b, sizeof(b), "cirs %d,%d,%d,%d", id(f_sx)(x), y, r, c);
              id(f_cmd)(b);
            };
            // xstr x,y,w,h,font,pco,bco,xcen,ycen,sta,"txt"  (xc: 0 left, 1 center, 2 right)
            id(f_str) = [](int x, int y, int w, int h, int font, int fg, int bg, int xc, const std::string &t) {
              std::string s = id(f_txt)(t, 40);
              char b[160];
              int px = id(f_sx)(x), pw = id(f_sx)(x + w) - px;
              snprintf(b, sizeof(b), "xstr %d,%d,%d,%d,%d,%d,%d,%d,1,1,\"%s\"", px, y, pw, h, font, fg, bg, xc, s.c_str());
              id(f_cmd)(b);
            };

            // ---------------- entity model ----------------
            id(f_dom) = [](int i) -> std::string {
              const std::string &e = id(g_eid)[i];
              return e.substr(0, e.find('.'));
            };

            id(f_on) = [](int i) -> bool {
              std::string d = id(f_dom)(i);
              const std::string &s = id(g_st)[i];
              if (d == "climate") return s != "off" && s != "unavailable" && s != "unknown";
              if (d == "cover") return s == "open" || s == "opening";
              if (d == "lock") return s == "unlocked" || s == "open";
              if (d == "media_player") return s == "playing";
              return s == "on";
            };

            id(f_val) = [](int i) -> std::string {
              std::string d = id(f_dom)(i);
              const std::string &s = id(g_st)[i];
              const std::string &x = id(g_ex)[i];
              if (s == "unavailable" || s == "unknown") return "n/d";
              if (d == "light") {
                if (s != "on") return "Wył.";
                if (!x.empty() && x != "0") return x + "%";
                return "Wł.";
              }
              if (d == "switch" || d == "input_boolean" || d == "fan") return s == "on" ? "Wł." : "Wył.";
              if (d == "climate") {
                std::string c = id(f_part)(x, 0);
                if (!c.empty()) return id(f_fmt)(c) + "°";
                return s;
              }
              if (d == "cover") {
                if (!x.empty()) return x + "%";
                if (s == "open") return "Otwarte";
                if (s == "closed") return "Zamknięte";
                if (s == "opening") return "Otwiera";
                if (s == "closing") return "Zamyka";
                return s;
              }
              if (d == "binary_sensor") {
                if (x == "door" || x == "window" || x == "opening" || x == "garage_door") return s == "on" ? "Otwarte" : "Zamknięte";
                if (x == "motion" || x == "occupancy" || x == "presence") return s == "on" ? "Ruch" : "Brak";
                return s == "on" ? "Wł." : "Wył.";
              }
              if (d == "lock") return s == "locked" ? "Zamknięty" : (s == "unlocked" ? "Otwarty" : s);
              if (d == "media_player") {
                if (s == "playing") return "Gra";
                if (s == "paused") return "Pauza";
                if (s == "off") return "Wył.";
                if (s == "idle") return "Czeka";
                return s;
              }
              if (d == "script") return s == "on" ? "Działa" : "";
              if (d == "scene") return "";
              std::string v = id(f_fmt)(s);
              if (!x.empty()) {
                if (x == "%" || (uint8_t) x[0] == 0xC2) v += x;
                else v += " " + x;
              }
              return v;
            };

            id(f_col) = [](int i) -> int {
              if (!id(f_on)(i)) return 10599;
              std::string d = id(f_dom)(i);
              if (d == "light") return 64900;
              if (d == "climate") {
                std::string a = id(f_part)(id(g_ex)[i], 2);
                if (a == "heating") return 64359;
                if (a == "cooling") return 17599;
                return 11828;
              }
              if (d == "cover") return 37919;
              if (d == "binary_sensor" || d == "lock") return 60042;
              return 11828;
            };

            // ---------------- selection + room overrides (flash) ----------------
            // p_sel: h = shown although not suggested, h|0x80000000 = hidden although suggested
            id(f_shown) = [](int i) -> bool {
              uint32_t h = id(f_hash)(id(g_eid)[i]);
              for (int k = 0; k < 64; k++) {
                if (id(p_sel)[k] == h) return true;
                if (id(p_sel)[k] == (h | 0x80000000u)) return false;
              }
              return id(g_sug)[i] != 0;
            };
            id(f_setshown) = [](int i, bool on) {
              uint32_t h = id(f_hash)(id(g_eid)[i]);
              for (int k = 0; k < 64; k++) if ((id(p_sel)[k] & 0x7FFFFFFFu) == h) id(p_sel)[k] = 0;
              bool sug = id(g_sug)[i] != 0;
              if (on == sug) return;
              for (int k = 0; k < 64; k++) {
                if (id(p_sel)[k] == 0) { id(p_sel)[k] = on ? h : (h | 0x80000000u); return; }
              }
              ESP_LOGW("dom", "Selection table full (64)");
            };
            id(f_move) = [](int i, int a) {
              uint32_t h = id(f_hash)(id(g_eid)[i]);
              for (int k = 0; k < 32; k++) if (id(p_mve)[k] == h) { id(p_mve)[k] = 0; id(p_mva)[k] = 0; }
              if (a != id(g_area0)[i]) {
                bool ok = false;
                for (int k = 0; k < 32; k++) {
                  if (id(p_mve)[k] == 0) { id(p_mve)[k] = h; id(p_mva)[k] = id(f_hash)(id(a_name)[a]); ok = true; break; }
                }
                if (!ok) { ESP_LOGW("dom", "Move table full (32)"); return; }
                id(g_sug)[i] = 1;
              } else {
                id(g_sug)[i] = id(g_sug0)[i];
              }
              id(g_area)[i] = a;
              id(f_setshown)(i, true);
            };
            id(f_apply) = []() {
              int n = id(g_eid).size();
              int na = id(a_name).size();
              for (int i = 0; i < n; i++) {
                uint32_t h = id(f_hash)(id(g_eid)[i]);
                for (int k = 0; k < 32; k++) {
                  if (id(p_mve)[k] != h) continue;
                  for (int a = 0; a < na; a++) {
                    if (id(f_hash)(id(a_name)[a]) == id(p_mva)[k]) { id(g_area)[i] = a; id(g_sug)[i] = 1; break; }
                  }
                  break;
                }
              }
            };
            id(f_room) = [](int a, bool shown) -> std::vector<int> {
              std::vector<int> r;
              for (int i = 0; i < (int) id(g_eid).size(); i++) {
                if (id(g_area)[i] == a && (!shown || id(f_shown)(i))) r.push_back(i);
              }
              return r;
            };

            // ---------------- UI parts ----------------
            id(f_top) = [](const std::string &t, const std::string &l, const std::string &r) {
              id(f_fill)(0, 0, 480, 40, 6372);
              id(f_str)(0, 0, 60, 40, 1, 61278, 6372, 1, l);
              id(f_str)(60, 0, 360, 40, 1, 61278, 6372, 1, t);
              id(f_str)(420, 0, 60, 40, 1, 61278, 6372, 1, r);
            };
            id(f_bot) = [](const std::string &l, const std::string &c, const std::string &r, bool cbtn) {
              id(f_fill)(0, 278, 480, 42, 2146);
              if (!l.empty()) id(f_str)(4, 282, 112, 36, 0, 61278, 14858, 1, l);
              id(f_str)(120, 282, 240, 36, 0, cbtn ? 61278 : 35988, cbtn ? 14858 : 2146, 1, c);
              if (!r.empty()) id(f_str)(364, 282, 112, 36, 0, 61278, 14858, 1, r);
            };

            // tile slot 0..5 on dashboard (3 x 2)
            id(f_tile) = [](int s) {
              int k = id(v_tpage) * 6 + s;
              int x = 4 + (s % 3) * 159, y = 44 + (s / 3) * 118, w = 153, h = 112;
              if (k >= (int) id(v_list).size()) return;
              int i = id(v_list)[k];
              bool on = id(f_on)(i);
              int bg = id(f_col)(i);
              int fg = on ? 4226 : 61278;
              int dim = on ? 4226 : 35988;
              std::string d = id(f_dom)(i);
              id(f_fill)(x, y, w, h, bg);
              if (d == "sensor") id(f_fill)(x + 12, y + 13, 14, 14, dim);
              else id(f_circ)(x + 20, y + 20, 9, dim);
              std::string v = id(f_val)(i);
              id(f_str)(x + 36, y + 4, w - 42, 34, id(f_len)(v) <= 7 ? 1 : 0, fg, bg, 2, v);
              if (d == "climate") {
                std::string t = id(f_part)(id(g_ex)[i], 1);
                if (!t.empty() && t != "None") id(f_str)(x + 36, y + 40, w - 42, 20, 0, dim, bg, 2, "cel " + id(f_fmt)(t) + "°");
              }
              std::string l1, l2;
              id(f_split)(id(g_name)[i], 17, l1, l2);
              if (l2.empty()) {
                id(f_str)(x + 8, y + h - 28, w - 14, 24, 0, fg, bg, 0, l1);
              } else {
                id(f_str)(x + 8, y + h - 50, w - 14, 22, 0, fg, bg, 0, l1);
                id(f_str)(x + 8, y + h - 27, w - 14, 22, 0, fg, bg, 0, l2);
              }
            };

            // ---------------- home overview: weather scene + big values ----------------
            // weather group: 0 clear 1 partly 2 cloudy 3 fog 4 rain 5 storm 6 snow 7 wind
            id(f_grp) = [](const std::string &w) -> int {
              if (w == "partlycloudy") return 1;
              if (w == "cloudy") return 2;
              if (w == "fog") return 3;
              if (w == "rainy" || w == "pouring" || w == "hail" || w == "snowy-rainy") return 4;
              if (w == "lightning" || w == "lightning-rainy") return 5;
              if (w == "snowy") return 6;
              if (w == "windy" || w == "windy-variant") return 7;
              return 0;
            };
            id(f_wgrp) = []() -> int { return id(f_grp)(id(o_wx)); };
            // time of day from sun elevation: 0 night 1 dusk 2 day
            id(f_tcls) = []() -> int {
              float e = id(o_elev);
              return e < -4.0f ? 0 : (e < 6.0f ? 1 : 2);
            };
            id(f_pal) = []() -> int { return id(f_tcls)() * 10 + id(f_wgrp)(); };
            id(f_rgb) = [](int r, int g, int b) -> int {
              r = r < 0 ? 0 : (r > 255 ? 255 : r);
              g = g < 0 ? 0 : (g > 255 ? 255 : g);
              b = b < 0 ? 0 : (b > 255 ? 255 : b);
              return ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
            };
            // sky band color 0..15 (20 px each)
            id(f_sky) = [](int band) -> int {
              static const int top[8][3] = {{30,100,190},{50,105,170},{80,92,110},{105,110,118},{45,55,72},{28,26,45},{90,105,125},{55,110,170}};
              static const int bot[8][3] = {{90,155,215},{110,150,195},{125,135,150},{150,155,160},{85,95,110},{65,58,80},{145,155,170},{115,155,190}};
              int g = id(f_wgrp)(), t = id(f_tcls)();
              bool clearish = (g == 0 || g == 1 || g == 7);
              float a[3], b[3];
              for (int k = 0; k < 3; k++) { a[k] = top[g][k]; b[k] = bot[g][k]; }
              if (t == 1) {
                if (clearish) { a[0] = 40; a[1] = 45; a[2] = 100; b[0] = 215; b[1] = 115; b[2] = 70; }
                else for (int k = 0; k < 3; k++) { a[k] *= 0.6f; b[k] *= 0.6f; }
              } else if (t == 0) {
                if (clearish) { a[0] = 4; a[1] = 8; a[2] = 26; b[0] = 22; b[1] = 32; b[2] = 66; }
                else for (int k = 0; k < 3; k++) { a[k] *= 0.3f; b[k] *= 0.3f; }
              }
              float f = band / 15.0f;
              return id(f_rgb)((int) (a[0] + (b[0] - a[0]) * f), (int) (a[1] + (b[1] - a[1]) * f), (int) (a[2] + (b[2] - a[2]) * f));
            };
            id(f_line) = [](int x0, int y0, int x1, int y1, int c) {
              char b[48];
              snprintf(b, sizeof(b), "line %d,%d,%d,%d,%d", id(f_sx)(x0), y0, id(f_sx)(x1), y1, c);
              id(f_cmd)(b);
            };
            // transparent text with drop shadow (xstr sta=3)
            id(f_strt) = [](int x, int y, int w, int h, int font, int fg, int xc, const std::string &t) {
              std::string s = id(f_txt)(t, 40);
              char b[160];
              int px = id(f_sx)(x), pw = id(f_sx)(x + w) - px;
              snprintf(b, sizeof(b), "xstr %d,%d,%d,%d,%d,0,0,%d,1,3,\"%s\"", px + 2, y + 2, pw, h, font, xc, s.c_str());
              id(f_cmd)(b);
              snprintf(b, sizeof(b), "xstr %d,%d,%d,%d,%d,%d,0,%d,1,3,\"%s\"", px, y, pw, h, font, fg, xc, s.c_str());
              id(f_cmd)(b);
            };
            // ---------------- home layout (built in the HA editor) ----------------
            // grid 24 x 16 cells of 20 px (logical 480 x 320); tile rect = cells minus 2 px margin
            // types: W weather, C clock, V value, B value + bar, T toggle, K climate
            //        (V with opt2 "g13" = G13 tariff tile, drawn by f_g13)
            //        (V with opt2 "dom" = house tile, drawn by f_dtile)
            id(f_trect) = [](int i, int &x, int &y, int &w, int &h) {
              x = id(lt_c)[i] * 20 + 2; y = id(lt_r)[i] * 20 + 2;
              w = id(lt_w)[i] * 20 - 4; h = id(lt_h)[i] * 20 - 4;
            };
            // largest font <= maxf whose text fits the box; per-glyph Arial advance widths (em units)
            // fonts 0-2 regular, 3-4 bold; em ~= 0.87 * font height
            id(f_fit) = [](const std::string &t, int maxw, int maxh, int maxf) -> int {
              static const int fh[5] = {16, 24, 32, 56, 72};
              maxw = maxw * id(p_uiw) / 480;  // boxes are squeezed to the visible width, fonts are not
              for (int f = maxf; f > 0; f--) {
                if (fh[f] > maxh) continue;
                bool bold = f >= 3;
                float em = 0;
                for (size_t i = 0; i < t.size(); i++) {
                  uint8_t c = (uint8_t) t[i];
                  if ((c & 0xC0) == 0x80) continue;
                  float k;
                  if (c >= '0' && c <= '9') k = 0.556f;
                  else if (c == '.' || c == ',' || c == ' ' || c == ';') k = 0.278f;
                  else if (c == ':') k = bold ? 0.333f : 0.278f;
                  else if (c == 0xC2 && i + 1 < t.size() && (uint8_t) t[i + 1] == 0xB0) k = 0.4f;
                  else if (c == '-') k = 0.333f;
                  else if (c == '%') k = 0.889f;
                  else if (strchr("iljI|!'", c)) k = bold ? 0.278f : 0.222f;
                  else if (strchr("tfr", c)) k = bold ? 0.36f : 0.3f;
                  else if (c == 'm') k = bold ? 0.889f : 0.833f;
                  else if (c == 'w') k = bold ? 0.778f : 0.722f;
                  else if (c == 'M') k = 0.833f;
                  else if (c == 'W') k = 0.944f;
                  else if (c >= 'a' && c <= 'z') k = bold ? 0.6f : 0.54f;
                  else if (c >= 'A' && c <= 'Z') k = bold ? 0.72f : 0.68f;
                  else k = bold ? 0.6f : 0.56f;
                  em += k;
                }
                if (em * fh[f] * 0.87f <= maxw) return f;
              }
              return 0;
            };
            // weather tile zones from its height (priority: clock, temp, condition, info)
            id(f_wzones) = []() {
              id(wz_clock) = id(wz_cond) = id(wz_temp) = id(wz_info) = -1;
              if (id(wr_w) <= 0) return;
              int avail = id(wr_h) - 36;
              bool cl = !id(wr_noclock) && avail >= 72; if (cl) avail -= 72;
              int th = avail >= 80 ? 80 : (avail >= 56 ? avail : 0);
              avail -= th;
              bool cd = avail >= 30; if (cd) avail -= 30;
              id(wz_infon) = avail >= 84 ? 3 : (avail >= 32 ? 1 : 0);
              bool inf = id(wz_infon) > 0;
              int y = id(wr_y) + 36;
              if (cl) { id(wz_clock) = y; y += 72; }
              if (cd) { id(wz_cond) = y; y += 30; }
              if (th > 0) { id(wz_temp) = y; id(wz_temph) = th; y += th; }
              if (inf) id(wz_info) = y;
            };
            // sky + particles clipped to rect and to the weather tile (deterministic, partial redraws match)
            id(f_bg) = [](int x, int y, int w, int h) {
              int X = id(wr_x), Y = id(wr_y), W = id(wr_w), H = id(wr_h);
              if (W <= 0) return;
              int xa = std::max(x, X), xb = std::min(x + w, X + W), ya = std::max(y, Y), yb = std::min(y + h, Y + H);
              if (xb <= xa || yb <= ya) return;
              x = xa; y = ya; w = xb - xa; h = yb - ya;
              for (int band = 0; band < 16; band++) {
                int b0 = Y + band * H / 16, b1 = Y + (band + 1) * H / 16;
                int y0 = std::max(y, b0), y1 = std::min(y + h, b1);
                if (y1 > y0) id(f_fill)(x, y0, w, y1 - y0, id(f_sky)(band));
              }
              if (W < 20 || H < 60) return;
              const std::string &w0 = id(o_wx);
              int g = id(f_wgrp)(), t = id(f_tcls)();
              int kind = 0, cnt = 0;
              int area = W * H / 1000;
              if (g == 4) { kind = 1; cnt = (w0 == "pouring") ? area * 9 / 10 : area / 2; }
              else if (g == 5) { kind = 1; cnt = (w0 == "lightning-rainy") ? area * 6 / 10 : 0; }
              else if (g == 6) { kind = 2; cnt = area / 2; }
              else if (g == 3) { kind = 4; cnt = area / 5; }
              else if (g == 7) { kind = 4; cnt = area / 6; }
              else if (t == 0 && g == 0) { kind = 3; cnt = area / 3; }
              if (cnt > 70) cnt = 70;
              int crain = id(f_rgb)(150, 175, 205), csnow = id(f_rgb)(240, 245, 255);
              int cstar = id(f_rgb)(225, 225, 200), cstreak = id(f_rgb)(185, 192, 200);
              uint32_t r = 20260928u;
              for (int n = 0; n < cnt; n++) {
                r = r * 1103515245u + 12345u; int px = X + 4 + (r >> 8) % (W - 8);
                r = r * 1103515245u + 12345u; int py = Y + 40 + (r >> 8) % (H - 44);
                int k = kind;
                if (w0 == "snowy-rainy") k = (n & 1) ? 2 : 1;
                int x0 = px, y0 = py, x1 = px, y1 = py;
                if (k == 1) { x1 = px - 3; y1 = py + 9; }
                else if (k == 4) { x1 = px + 18; }
                else if (k == 3 && py > Y + H / 2) continue;
                int lx = std::min(x0, x1) - 2, rx = std::max(x0, x1) + 2, ty = std::min(y0, y1) - 2, by = std::max(y0, y1) + 2;
                if (lx < x || rx >= x + w || ty < y || by >= y + h) continue;
                if (k == 1) id(f_line)(x0, y0, x1, y1, crain);
                else if (k == 2) id(f_circ)(px, py, 2, csnow);
                else if (k == 3) id(f_circ)(px, py, 1, cstar);
                else if (k == 4) id(f_line)(x0, y0, x1, y1, cstreak);
              }
            };
            // sky colour at screen row y: bands of the weather tile (or the whole screen without it)
            id(f_skyy) = [](int y) -> int {
              int Y = id(wr_y), H = id(wr_h);
              if (id(wr_w) <= 0 || H <= 0) { Y = 0; H = 320; }
              int band = (y - Y) * 16 / H;
              band = band < 0 ? 0 : (band > 15 ? 15 : band);
              return id(f_sky)(band);
            };
            // rectangle filled with the sky bands aligned to the weather tile (G13 / Dom tiles)
            id(f_skyfill) = [](int x, int y, int w, int h) {
              int Y = id(wr_y), H = id(wr_h);
