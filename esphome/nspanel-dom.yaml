                if (id(lt_t)[i] == "V" && !id(lt_o1)[i].empty()) dec = atoi(id(lt_o1)[i].c_str());
                if (dec < 0 && unit == "W" && fabsf(v) >= 1000.0f) { v /= 1000.0f; unit = "kW"; dec = fabsf(v) < 10.0f ? 2 : 1; }
                if (dec < 0) dec = (s.find('.') == std::string::npos) ? 0 : (fabsf(v) < 100.0f ? 1 : 0);
                char b[24];
