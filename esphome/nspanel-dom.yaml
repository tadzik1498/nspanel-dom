                t.replace(p, 3, std::to_string(left));
              }
              if (clear) id(f_fill)(x + 8, y + 46, w - 16, 136, bg);
              auto lines = id(f_wrap)(t, w - 36);
              int n = std::min((int) lines.size(), 4);
              int ty = y + 50 + (4 - n) * 16;
              for (int k = 0; k < n; k++) id(f_str)(x + 16, ty + k * 32, w - 32, 32, 1, 65535, bg, 1, lines[k]);
            };
            // close the popup; what = ok / przycisk / timeout / "" (closed by HA, no event)
            id(f_mclose) = [](const std::string &what) {
              if (!id(m_on)) return;
              id(m_on) = false;
              id(m_flash_until) = 0;
              if (!what.empty()) id(ha_msg_event).execute(what, id(m_id));
              id(disp).set_backlight_brightness(id(p_bright) / 100.0f);
              id(f_draw)();
            };
            // redraw = current view + popup on top
            id(f_draw) = []() {
              id(f_draw0)();
              if (id(m_on)) id(f_popup)();
            };
            // built-in start layout: home screen right after boot, replaced by the layout from HA
            id(f_lload)(std::string("W|0|0|10|16||||||\n") +
                        "V|10|0|7|8|${e_temp_dom}|W domu||||°C\n" +
                        "K|17|0|7|8|${e_klima}|Klimatyzacja||||\n" +
                        "B|10|8|7|8|${e_moc}|Moc||${moc_max}||W\n" +
                        "V|17|8|7|8|${e_temp_dach}|Na dachu||||°C\n");
            id(o_ok) = true;
            id(v_view) = 5;
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # ten egzemplarz: ESP32 rev3.0, bootloader obsluguje SRAM1 jako IRAM
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: !secret nspanel_api_key
  on_client_connected:
    - if:
        condition:
          lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
        then:
          - delay: 3s
          - script.execute:
              id: ha_event
              what: sync
  actions:
    # start of catalog transfer
    - action: begin
      variables:
        count: int
      then:
        - lambda: |-
            ESP_LOGI("dom", "Catalog begin, %d areas", (int) count);
            id(g_sync) = true;
            id(g_eid).clear(); id(g_name).clear(); id(g_st).clear(); id(g_ex).clear();
            id(g_area).clear(); id(g_area0).clear(); id(g_sug).clear(); id(g_sug0).clear();
            id(a_name).clear(); id(a_floor).clear(); id(v_list).clear();
            id(f_draw)();
    # one area: items = lines "entity_id|name|suggested|state|extra"
    - action: area
      variables:
        idx: int
        name: string
        floor: string
        items: string
      then:
        - lambda: |-
            int a = id(a_name).size();
            id(a_name).push_back(name);
            id(a_floor).push_back(floor);
            size_t p = 0;
            while (p < items.size()) {
              size_t e = items.find('\n', p);
              if (e == std::string::npos) e = items.size();
              std::string ln = items.substr(p, e - p);
              p = e + 1;
              if (ln.empty()) continue;
              std::string f[5];
              int k = 0;
              size_t q = 0;
              while (k < 4) {
                size_t b = ln.find('|', q);
                if (b == std::string::npos) break;
                f[k++] = ln.substr(q, b - q);
                q = b + 1;
              }
              f[k] = ln.substr(q);
              if (f[0].empty() || f[0].find('.') == std::string::npos || id(g_eid).size() >= 400) continue;
              int s = (f[2] == "1") ? 1 : 0;
              id(g_eid).push_back(f[0]);
              id(g_name).push_back(f[1].empty() ? f[0] : f[1]);
              id(g_sug).push_back(s);
              id(g_sug0).push_back(s);
              id(g_st).push_back(f[3]);
              id(g_ex).push_back(f[4]);
              id(g_area).push_back(a);
              id(g_area0).push_back(a);
            }
            ESP_LOGD("dom", "Area %d '%s': total entities %u", (int) idx, name.c_str(), (unsigned) id(g_eid).size());
    # end of catalog transfer
    - action: done
      then:
        - lambda: |-
            id(f_apply)();
            id(g_sync) = false;
            id(v_area) = id(p_area);
            id(v_view) = id(o_ok) ? 5 : 0;
            id(v_tpage) = 0;
            ESP_LOGI("dom", "Catalog done: %u areas, %u entities", (unsigned) id(a_name).size(), (unsigned) id(g_eid).size());
            id(f_draw)();
    # home overview values (strings as sent by HA)
    - action: overview
      variables:
        wx: string
        elev: string
        tout: string
        wi1: string
        wi2: string
      then:
        - lambda: |-
            bool first = !id(o_ok);
            int oldpal = id(o_pal);
            std::string oldwx = id(o_wx);
            id(o_wx) = wx;
            id(o_elev) = elev.empty() ? 30.0f : strtof(elev.c_str(), nullptr);
            id(o_raw)[0] = tout;
            id(o_wi1) = wi1;
            id(o_wi2) = wi2;
            id(o_ok) = true;
            id(o_pal) = id(f_pal)();
            if (first && id(v_view) == 0 && (id(t_last) == 0 || millis() - id(t_last) > 30000)) id(v_view) = 5;
            if (id(v_view) != 5 || id(g_sync)) return;
            if (first) { id(f_draw)(); return; }
            if (id(disp).is_sleeping() || id(m_on)) return;
            if (id(o_pal) != oldpal) { id(f_draw)(); return; }
            if (wx != oldwx) { id(f_wtile)(); return; }
            if (id(f_wtval)() != id(o_shown)[0]) id(f_wtemp)(true);
            if (wi1 + "|" + wi2 != id(o_shown)[6]) id(f_winfo)(true);
    # home layout from the HA editor, one tile per line:
    # "type|col|row|cols|rows|entity|label|opt1|opt2|state|extra"
    - action: uklad
      variables:
        lines: string
      then:
        - lambda: |-
            id(f_lload)(lines);
            ESP_LOGI("dom", "Layout from HA: %u tiles", (unsigned) id(lt_t).size());
            bool first = !id(o_ok);
            id(o_ok) = true;
            if (first && id(v_view) == 0 && (id(t_last) == 0 || millis() - id(t_last) > 30000)) id(v_view) = 5;
            if (id(v_view) == 5 && !id(g_sync) && !id(disp).is_sleeping()) id(f_draw)();
    # forecast lines: godz "HH:MM|cond|temp|prob|mm", dni "Label|cond|tmax|tmin|prob|mm"
    - action: forecast
      variables:
        godz: string
        dni: string
      then:
        - lambda: |-
            auto split = [](const std::string &s, std::vector<std::string> &out) {
              out.clear();
              size_t p = 0;
              while (p < s.size()) {
                size_t e = s.find('\n', p);
                if (e == std::string::npos) e = s.size();
                if (e > p) out.push_back(s.substr(p, e - p));
                p = e + 1;
                if (out.size() >= 10) break;
              }
            };
            split(godz, id(fc_h));
            split(dni, id(fc_d));
            ESP_LOGI("dom", "Forecast: %u hours, %u days", (unsigned) id(fc_h).size(), (unsigned) id(fc_d).size());
            if (id(v_view) == 6 && !id(disp).is_sleeping()) id(f_draw)();
    # climate entity for the home tile and the climate screen (lists comma separated)
    - action: klima
      variables:
        kid: string
        st: string
        cur: string
        tgt: string
        step: string
        fan: string
        swing: string
        preset: string
        hm: string
        fm: string
        sm: string
        pm: string
        tmin: string
        tmax: string
      then:
        - lambda: |-
            auto csv = [](const std::string &s) -> std::vector<std::string> {
              std::vector<std::string> o;
              size_t p = 0;
              while (p < s.size()) {
                size_t e = s.find(',', p);
                if (e == std::string::npos) e = s.size();
                std::string t = s.substr(p, e - p);
                while (!t.empty() && t[0] == ' ') t.erase(0, 1);
                if (!t.empty()) o.push_back(t);
                p = e + 1;
              }
              return o;
            };
            id(k_id) = kid;
            id(k_cur) = cur;
            id(k_step) = step.empty() ? 1.0f : strtof(step.c_str(), nullptr);
            id(k_tmin) = tmin.empty() ? 0.0f : strtof(tmin.c_str(), nullptr);
            id(k_tmax) = tmax.empty() ? 0.0f : strtof(tmax.c_str(), nullptr);
            id(k_hm) = csv(hm);
            id(k_fm) = csv(fm);
            id(k_sm) = csv(sm);
            id(k_pm) = csv(pm);
            // keep local (optimistic) values for a few seconds after a touch
            if ((int32_t) (millis() - id(k_hold)) >= 0) {
              id(k_st) = st;
              id(k_tgt) = tgt;
              id(k_fan) = fan;
              id(k_swing) = swing;
              id(k_preset) = preset;
            }
            if (id(g_sync) || id(disp).is_sleeping()) return;
            if (id(v_view) == 7) { id(f_draw)(); return; }
            id(f_lupdate)("", "K");
            id(f_lupdate)("", "V");
    # message window: level 0 info, 1 warning, 2 alarm; czas 0 = until OK; przycisk = 2nd button label
    - action: wiadomosc
      variables:
        tytul: string
        tresc: string
        poziom: int
        dzwiek: string
        mruganie: int
        czas: int
        przycisk: string
        ident: string
      then:
        - lambda: |-
            id(m_title) = tytul.empty() ? std::string("Wiadomość") : tytul;
            id(m_text) = tresc;
            id(m_lvl) = poziom;
            id(m_btn2) = przycisk;
            id(m_id) = ident;
            id(m_on) = true;
            id(m_until) = czas > 0 ? millis() + (uint32_t) czas * 1000u : 0;
            id(m_flash_until) = mruganie > 0 ? millis() + (uint32_t) mruganie * 1000u : 0;
            id(g_dimmed) = false;
            id(t_last) = millis();
            id(disp).set_backlight_brightness(id(p_bright) / 100.0f);
            id(f_sound)(dzwiek);
            ESP_LOGI("dom", "Message (level %d): %s", (int) poziom, id(m_title).c_str());
            id(f_draw)();
    - action: wiadomosc_zamknij
      variables:
        ident: string
      then:
        - lambda: |-
            if (ident.empty() || ident == id(m_id)) id(f_mclose)("");
    - action: dzwiek
      variables:
        melodia: string
      then:
        - lambda: 'id(f_sound)(melodia);'
    # live state of one entity
    - action: state
      variables:
        eid: string
        st: string
        ex: string
      then:
        - lambda: |-
            auto &E = id(g_eid);
            for (int i = 0; i < (int) E.size(); i++) {
              if (E[i] != eid) continue;
              if (id(g_st)[i] == st && id(g_ex)[i] == ex) break;
              id(g_st)[i] = st;
              id(g_ex)[i] = ex;
              id(f_redraw_ent)(i);
              break;
            }
            bool hit = false;
            for (int i = 0; i < (int) id(lt_e).size(); i++) {
              if (id(lt_e)[i] != eid) continue;
              id(lt_s)[i] = st;
              if (!ex.empty() || id(lt_t)[i] != "V") id(lt_x)[i] = ex;
              hit = true;
            }
            if (hit) id(f_lupdate)(eid, "");

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

http_request:
  verify_ssl: false

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              if (id(m_on) || id(v_view) != 5 || !id(o_ok) || id(g_sync) || id(disp).is_sleeping()) return;
              id(f_clock)(true);
              id(f_lupdate)("", "C");
              id(f_lupdate)("", "V");
      # hourly chime during the configured hours
      - minutes: 0
        seconds: 0
        then:
          - lambda: |-
              if (!id(sw_gong).state) return;
              auto now = id(ha_time).now();
              if (!now.is_valid()) return;
              int h = now.hour, a = (int) id(n_gong_od).state, b = (int) id(n_gong_do).state;
              bool in = a <= b ? (h >= a && h < b) : (h >= a || h < b);
              if (in) id(f_sound)(id(sel_gong).current_option().str());
    on_time_sync:
      - lambda: |-
          if (!id(m_on) && id(v_view) == 5 && id(o_ok) && !id(g_sync) && !id(disp).is_sleeping()) { id(f_clock)(true); id(f_lupdate)("", "C"); }

uart:
  id: tf_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

display:
  - platform: nextion
    id: disp
    uart_id: tf_uart
    tft_url: ${tft_url}
    auto_wake_on_touch: true
    exit_reparse_on_start: true
    on_setup:
      - lambda: |-
          // never sleep: the panel dims instead (see interval "dim")
          id(disp).send_command_printf("thsp=0");
          id(disp).send_command_printf("thup=1");
          id(g_dimmed) = false;
          id(disp).set_backlight_brightness(id(p_bright) / 100.0f);
          id(v_area) = id(p_area);
          id(f_draw)();
    on_sleep:
      - lambda: 'id(q_cmd).clear();'
    on_wake:
      - lambda: |-
          id(t_wake) = millis();
          if (id(o_ok)) id(v_view) = 5;
          id(f_draw)();
    on_touch:
      - lambda: |-
          if (page_id != 0) return;
          if (millis() - id(t_wake) < 600) return;
          if (touch_event) {
            id(t_last) = millis();
            if (id(g_dimmed)) {
              // first touch on a dimmed screen only restores brightness
              id(g_dimmed) = false;
              id(disp).set_backlight_brightness(id(p_bright) / 100.0f);
              id(t_cell) = -1;
              return;
            }
            id(t_cell) = component_id;
            id(t_ms) = millis();
            return;
          }
          if (id(t_cell) < 0) return;
          int c = id(t_cell);
          id(t_cell) = -1;
          id(t_last) = millis();
          id(f_touch)(c, (millis() - id(t_ms)) > 650);

interval:
  # paced command queue: max 3 commands / 20 ms (Nextion 1 kB input buffer)
  - interval: 20ms
    then:
      - lambda: |-
          auto &q = id(q_cmd);
          if (q.empty()) return;
          if (!id(disp).is_setup() || id(disp).is_sleeping()) { q.clear(); return; }
          size_t n = q.size() < 3 ? q.size() : 3;
          for (size_t k = 0; k < n; k++) id(disp).send_command_printf("%s", q[k].c_str());
          q.erase(q.begin(), q.begin() + n);
  # message: auto close after its time
  - interval: 1s
    then:
      - lambda: |-
          if (id(m_on) && id(m_until) != 0 && (int32_t) (millis() - id(m_until)) >= 0) { id(f_mclose)("timeout"); return; }
          if (id(m_on) && id(m_text).find("{s}") != std::string::npos && !id(disp).is_sleeping()) id(f_ptext)(true);
  # message: backlight flashing
  - interval: 300ms
    then:
      - lambda: |-
          if (id(m_flash_until) == 0) return;
          if (!id(m_on) || (int32_t) (millis() - id(m_flash_until)) >= 0) {
            id(m_flash_until) = 0;
            id(disp).set_backlight_brightness(id(p_bright) / 100.0f);
            return;
          }
          id(m_flash_on) = !id(m_flash_on);
          id(disp).set_backlight_brightness(id(m_flash_on) ? 1.0f : 0.08f);
  # redraw after wake if state changed during sleep
  - interval: 2s
    then:
      - lambda: |-
          if (id(g_dirty) && id(disp).is_setup() && !id(disp).is_sleeping()) id(f_draw)();
  # dim the backlight after p_dim_s seconds without touch and show the home overview
  - interval: 1s
    then:
      - lambda: |-
          if (id(g_dimmed) || id(m_on) || !id(disp).is_setup()) return;
          if (millis() - id(t_last) < (uint32_t) id(p_dim_s) * 1000u) return;
          id(g_dimmed) = true;
          id(disp).set_backlight_brightness(id(p_dim) / 100.0f);
          if (id(o_ok) && id(v_view) != 5 && !id(g_sync)) { id(v_view) = 5; id(f_draw)(); }
  # back to the home overview after 60 s without touch
  - interval: 5s
    then:
      - lambda: |-
          if (!id(o_ok) || id(m_on) || id(v_view) == 5 || id(g_sync) || id(disp).is_sleeping()) return;
          if (millis() - id(t_last) < 60000) return;
          id(v_view) = 5;
          id(f_draw)();

