            };
            // sun / moon / clouds / lightning, only in the top 36 px of the weather tile
            id(f_decor) = []() {
              int X = id(wr_x), Y = id(wr_y), W = id(wr_w);
              if (W < 60) return;
              int g = id(f_wgrp)(), t = id(f_tcls)();
              bool clearish = (g == 0 || g == 1 || g == 7);
              int sx = X + W - 24, sy = Y + 17;
              if (clearish) {
                if (t == 2) { id(f_circ)(sx, sy, 14, id(f_rgb)(255, 214, 90)); id(f_cmd)("cir " + std::to_string(id(f_sx)(sx)) + "," + std::to_string(sy) + ",17," + std::to_string(id(f_rgb)(255, 232, 150))); }
                else if (t == 1) id(f_circ)(sx, sy + 3, 13, id(f_rgb)(255, 150, 70));
                else { id(f_circ)(sx, sy, 12, id(f_rgb)(235, 232, 210)); id(f_circ)(sx + 6, sy - 4, 10, id(f_sky)(0)); }
              }
              int n = (g == 1 || g == 7) ? 2 : (clearish ? 0 : (W >= 170 ? 4 : 3));
              int cc;
              if (g == 1 || g == 7) cc = t == 2 ? id(f_rgb)(235, 238, 243) : (t == 1 ? id(f_rgb)(180, 170, 180) : id(f_rgb)(60, 66, 84));
              else if (g == 2 || g == 3) cc = t == 2 ? id(f_rgb)(175, 180, 190) : (t == 1 ? id(f_rgb)(130, 132, 142) : id(f_rgb)(52, 56, 70));
              else if (g == 5) cc = id(f_rgb)(80, 80, 98);
              else cc = t == 2 ? id(f_rgb)(120, 126, 138) : id(f_rgb)(62, 66, 80);
