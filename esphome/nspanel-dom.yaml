                float q = p / 0.5f;
                return id(f_rgb)((int) (60 + 180 * q), 200, (int) (90 - 50 * q));
              }
              float q = (p - 0.5f) / 0.5f;
              return id(f_rgb)((int) (240 - 5 * q), (int) (200 - 140 * q), (int) (40 + 10 * q));
            };
            // climate tile main value
            id(f_kval) = []() -> std::string {
              if (id(k_id).empty()) return "--";
              if (id(k_st) == "off") return "Wył.";
              char *end = nullptr;
              float t = strtof(id(k_tgt).c_str(), &end);
              if (id(k_tgt).empty() || end == id(k_tgt).c_str()) return "--";
              char b[16];
              snprintf(b, sizeof(b), id(k_step) < 0.99f ? "%.1f" : "%.0f", t);
              return std::string(b) + "°";
            };
            // label and value text for V / B tiles
            id(f_lval) = [](int i, std::string &lbl, std::string &val, float &frac) {
              const std::string &s = id(lt_s)[i];
              std::string unit = (id(lt_t)[i] == "V" && !id(lt_o2)[i].empty()) ? id(lt_o2)[i] : id(lt_x)[i];
              char *end = nullptr;
              float v = strtof(s.c_str(), &end);
              bool num = !s.empty() && end != s.c_str() && *end == 0;
              frac = 0;
              if (!num) {
                if (s.empty() || s == "unavailable" || s == "unknown") val = "--";
                else if (s == "on") val = "Wł.";
                else if (s == "off") val = "Wył.";
                else val = id(f_lbl)(0, s);
              } else {
                if (id(lt_t)[i] == "B") {
                  float mn = id(lt_o1)[i].empty() ? 0.0f : strtof(id(lt_o1)[i].c_str(), nullptr);
                  float mx = id(lt_o2)[i].empty() ? 100.0f : strtof(id(lt_o2)[i].c_str(), nullptr);
                  if (mx > mn) frac = (v - mn) / (mx - mn);
                  frac = frac < 0 ? 0 : (frac > 1 ? 1 : frac);
                }
