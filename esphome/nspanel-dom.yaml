            id(f_tbg) = []() -> int { return id(f_mix)(id(f_rgb)(34, 38, 50), id(f_sky)(3), 0.28f); };
            // accent colour of a tile (top bar + frame) from its state
            id(f_acc) = [](int i) -> int {
