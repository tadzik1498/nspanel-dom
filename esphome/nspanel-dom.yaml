              if (t == "T") {
                const std::string &s = id(lt_s)[i];
                bool on = (s == "on" || s == "open" || s == "playing" || s == "unlocked" || s == "heat" || s == "cool");
                return on ? (id(lt_e)[i].rfind("light.", 0) == 0 ? 64900 : 11828) : id(f_rgb)(110, 116, 130);
              }
              const std::string &s = id(lt_s)[i];
              char *end = nullptr;
              float v = strtof(s.c_str(), &end);
              bool num = !s.empty() && end != s.c_str();
              if (t == "B") {
                if (!num) return neutral;
                std::string l, val; float f;
                id(f_lval)(i, l, val, f);
                return id(f_heat)(f);
              }
              if (t == "V" && num) {
                std::string u = id(lt_o2)[i].empty() ? id(lt_x)[i] : id(lt_o2)[i];
                if (u.find("°") != std::string::npos) {
                  if (v < 5) return id(f_rgb)(80, 150, 255);
                  if (v < 18) return id(f_rgb)(80, 200, 235);
                  if (v < 24) return id(f_rgb)(70, 205, 120);
                  if (v < 28) return id(f_rgb)(255, 176, 32);
                  return id(f_rgb)(255, 90, 60);
                }
                if (u == "%") return id(f_rgb)(90, 190, 255);
              }
              return neutral;
            };
            // 1 px rectangle outline (scaled like the other primitives)
            id(f_drect) = [](int x, int y, int w, int h, int c) {
              char b[48];
              snprintf(b, sizeof(b), "draw %d,%d,%d,%d,%d", id(f_sx)(x), y, id(f_sx)(x + w) - 1, y + h - 1, c);
              id(f_cmd)(b);
            };
            // tile body: tinted fill, 4 px accent bar on top, 2 px accent frame
            id(f_tbody) = [](int x, int y, int w, int h, int bg, int acc) {
              id(f_fill)(x, y, w, h, bg);
              int dim = id(f_mix)(acc, bg, 0.45f);
              id(f_drect)(x, y, w, h, dim);
              id(f_drect)(x + 1, y + 1, w - 2, h - 2, dim);
              id(f_fill)(x, y, w, 4, acc);
            };
            // label: 24 px when there is room; too long -> shortened with '.', never tiny
            id(f_label) = [](int x, int y, int w, int h, int bg, const std::string &t) {
              int lf = h >= 28 ? 1 : 0;
              std::string s = t;
              if (lf == 1) {
                int n = id(f_len)(s);
                while (n > 3 && id(f_fit)(s, w, 28, 1) < 1) {
                  size_t cut = s.size();
                  int k = 0;
                  for (size_t j = 0; j < s.size(); j++) if (((uint8_t) s[j] & 0xC0) != 0x80) { if (k == n - 2) { cut = j; break; } k++; }
                  s = s.substr(0, cut);
                  while (!s.empty() && (s.back() == ' ' || s.back() == '.')) s.pop_back();
                  s += ".";
                  n = id(f_len)(s);
                }
              }
              id(f_str)(x, y, w, h, lf, id(f_rgb)(222, 228, 240), bg, 0, s);
            };
            // ---------------- G13 tariff tile ----------------
            // layout tile "V" with opt2 == "g13" (editor type "Prad G13")
            // state (sensor.nspanel_g13_data): "Z;next;pct;p;a;b;segs;month"
            //   Z zone P/A/B, next "16:00" or "pn 07:00", pct savings % vs G11,
            //   p/a/b kWh share % (cheap/medium/expensive), segs today "P0A7P13B16P21",
            //   month savings PLN this month
            // look: sky background like the weather tile, thick frame in the zone colour,
            // big values for elderly users, 24 h zone dial with a "now" needle
            id(f_g13) = [](int i, int x, int y, int w, int h) {
              const std::string &s = id(lt_s)[i];
              auto fld = [&s](int n) -> std::string {
                size_t p = 0;
                for (int k = 0; k < n; k++) {
                  p = s.find(';', p);
                  if (p == std::string::npos) return "";
                  p++;
                }
                size_t e = s.find(';', p);
                return s.substr(p, e == std::string::npos ? std::string::npos : e - p);
              };
              int cP = id(f_rgb)(67, 190, 71), cA = id(f_rgb)(255, 150, 0), cB = id(f_rgb)(240, 50, 45);
              int cS = id(f_rgb)(38, 190, 175), cG = id(f_rgb)(100, 115, 210), cN = id(f_rgb)(120, 126, 140);
              std::string z = fld(0);
              bool ok = (z == "P" || z == "A" || z == "B");
              int zc = z == "B" ? cB : (z == "A" ? cA : (z == "P" ? cP : cN));
              // background + thick zone frame (visible from far away)
              id(f_skyfill)(x, y, w, h);
              int fr = w >= 120 && h >= 120 ? 7 : 5;
              id(f_fill)(x, y, w, fr, zc);
              id(f_fill)(x, y + h - fr, w, fr, zc);
              id(f_fill)(x, y, fr, h, zc);
              id(f_fill)(x + w - fr, y, fr, h, zc);
              int X = x + fr + 4, Y = y + fr + 2, W = w - 2 * fr - 8, H = h - 2 * fr - 4;
              // header: zone name + end of the zone
              std::string zn = z == "B" ? "Drogi" : (z == "A" ? "Średni" : (z == "P" ? "Tani" : "G13"));
              std::string nx = ok ? fld(1) : "";
              int hh = H >= 140 ? 38 : 30, hh2 = 0;
              std::string head = nx.empty() ? zn : zn + " do " + nx, sub = "";
              if (id(f_fit)(head, W, hh, 2) < 2 && !nx.empty()) {
                if (H >= 150) { head = zn; sub = "do " + nx; hh2 = 26; }
                else if (id(f_fit)(head, W, hh, 2) < 1) head = zn;
              }
              id(f_strt)(X, Y, W, hh, id(f_fit)(head, W, hh, 2), zc, 1, head);
              if (hh2) id(f_strt)(X, Y + hh - 4, W, hh2, id(f_fit)(sub, W, hh2, 1), 65535, 1, sub);
              // today's zones (letter + start hour)
              std::string sg = ok ? fld(6) : "";
              std::vector<std::pair<char, int>> v;
              size_t p = 0;
              while (p < sg.size()) {
                char c = sg[p++];
                int n = 0;
                bool dig = false;
                while (p < sg.size() && sg[p] >= '0' && sg[p] <= '9') { n = n * 10 + (sg[p] - '0'); p++; dig = true; }
                if (dig && (c == 'P' || c == 'A' || c == 'B') && n >= 0 && n < 24) v.push_back({c, n});
              }
              auto zcol = [&](char c) -> int { return c == 'B' ? cB : (c == 'A' ? cA : cP); };
              // middle: three rings - 24 h zone dial (outer) with the "now" needle,
              // saved vs paid, kWh per zone - and the legend
              int top = Y + hh + (hh2 ? hh2 - 4 : 0), bot = Y + H;
              float pct = ok ? strtof(fld(2).c_str(), nullptr) : 0.0f;
              float sP = ok ? strtof(fld(3).c_str(), nullptr) : 0.0f;
              float sA = ok ? strtof(fld(4).c_str(), nullptr) : 0.0f;
              float sB = ok ? strtof(fld(5).c_str(), nullptr) : 0.0f;
              float tot = sP + sA + sB;
              std::string mon = ok ? fld(7) : "";
              int mh = bot - top;
              int R = std::min(mh, W) / 2;
              bool side = W - 2 * R >= 110;
              if (!side && W >= 2 * 40 + 110) { R = (W - 110) / 2; side = true; }
              bool below = !side && mh - 2 * std::min(R, 40) >= 28 && tot > 0;
              if (below) R = std::min(mh - 30, W) / 2;
              if (R > 90) R = 90;
              if (R < 20) return;
              int grp = 2 * R + (below ? 30 : 0);
              int cx = side ? X + R : X + W / 2;
              int cy = top + R + std::max(0, (mh - grp) / 2);
              int t3 = R >= 40 ? std::max(15, R * 22 / 100) : std::max(8, R * 22 / 100);  // room for hour numbers
              int t2 = std::max(5, R * 11 / 100), t1 = std::max(5, R * 11 / 100);
              int r3o = R, r3i = R - t3;                  // 24 h dial
              int r2o = r3i - 3, r2i = r2o - t2;          // saved vs paid
              int r1o = r2i - 2, r1i = r1o - t1;          // kWh per zone
              float kx = 480.0f / id(p_uiw);  // radial lines are drawn in logical x, circles in physical
              auto rad = [&](float a, int r0, int r1, int c) {
                float sn = sinf(a * 6.2832f), cs = cosf(a * 6.2832f);
                id(f_line)(cx + (int) lroundf(r0 * sn * kx), cy - (int) lroundf(r0 * cs),
                           cx + (int) lroundf(r1 * sn * kx), cy - (int) lroundf(r1 * cs), c);
              };
              auto arc = [&](int r0, int r1, float f0, float f1, int c) {
                if (f1 <= f0) return;
                int n = (int) ceilf((f1 - f0) * 6.2832f * r1 / 1.1f);
                if (n > 260) n = 260;
                for (int k = 0; k <= n; k++) rad(f0 + (f1 - f0) * k / std::max(1, n), r0, r1, c);
              };
              // disk filled with the sky rows (cuts a ring without a flat patch)
              auto skydisk = [&](int r) {
                for (int dy = -r; dy < r; dy += 2) {
                  float yy = dy + 1.0f;
                  float hf = sqrtf(std::max(0.0f, (float) r * r - yy * yy));
                  int hw = (int) (hf * kx + 0.5f);
                  if (hw > 0) id(f_fill)(cx - hw, cy + dy, 2 * hw, 2, id(f_skyy)(cy + dy));
                }
              };
              int SK = id(f_skyy)(cy);
              auto sep = [&](int r0, int r1, float f) { for (int d = -1; d <= 1; d++) rad(f + d * 0.1f / r1, r0, r1 + 1, SK); };
              int ring0 = id(f_mix)(SK, 0, 0.45f);
              int tick = id(f_rgb)(20, 22, 30);
              // ring 3: 24 h dial, 0:00 at the top, clockwise (6 right, 12 bottom, 18 left)
              if (v.empty()) {
                id(f_circ)(cx, cy, r3o, ring0);
              } else {
                int hrs[3] = {0, 0, 0};
                for (size_t k = 0; k < v.size(); k++) {
                  int a = v[k].second, b = k + 1 < v.size() ? v[k + 1].second : 24;
                  hrs[v[k].first == 'P' ? 0 : (v[k].first == 'A' ? 1 : 2)] += b - a;
                }
                char base = hrs[0] >= hrs[1] && hrs[0] >= hrs[2] ? 'P' : (hrs[1] >= hrs[2] ? 'A' : 'B');
                id(f_circ)(cx, cy, r3o, zcol(base));
                for (size_t k = 0; k < v.size(); k++) {
                  if (v[k].first == base) continue;
                  int a = v[k].second, b = k + 1 < v.size() ? v[k + 1].second : 24;
                  arc(r3i, r3o - 1, a / 24.0f, b / 24.0f, zcol(v[k].first));
                }
              }
              skydisk(r3i);
              // hour ticks on the dial, long ones at 0 / 6 / 12 / 18
              for (int hr = 0; hr < 24; hr++) {
                bool major = hr % 6 == 0;
                float a = hr / 24.0f;
                if (major) { rad(a - 0.6f / (r3o * 6.2832f), r3i, r3o - 1, tick); rad(a, r3i, r3o - 1, tick); rad(a + 0.6f / (r3o * 6.2832f), r3i, r3o - 1, tick); }
                else rad(a, r3o - t3 * 45 / 100, r3o - 1, tick);
              }
              // ring 2: saved (from the top) vs paid
              float f1 = pct / 100.0f;
              f1 = f1 < 0 ? 0 : (f1 > 1 ? 1 : f1);
              id(f_circ)(cx, cy, r2o, ok ? cG : ring0);
              if (ok && f1 > 0) { arc(r2i, r2o - 1, 0.0f, f1, cS); sep(r2i, r2o, 0.0f); sep(r2i, r2o, f1); }
              skydisk(r2i);
              // ring 1: kWh per zone
              id(f_circ)(cx, cy, r1o, tot > 0 ? cP : ring0);
              if (tot > 0) {
                float a0 = sP / tot, a1 = (sP + sA) / tot;
                arc(r1i, r1o - 1, a0, a1, cA);
                arc(r1i, r1o - 1, a1, 1.0f, cB);
                sep(r1i, r1o, 0.0f); sep(r1i, r1o, a0); sep(r1i, r1o, a1);
              }
              skydisk(r1i);
              // hour numbers on the dial (big enough tiles only)
              if (t3 >= 15) {
                const char *lb[4] = {"0", "6", "12", "18"};
                int rm = (r3o + r3i) / 2;
                for (int q = 0; q < 4; q++) {
                  float a = q * 0.25f;
                  int lx = cx + (int) lroundf(rm * sinf(a * 6.2832f) * kx), ly = cy - (int) lroundf(rm * cosf(a * 6.2832f));
                  int bw2 = q >= 2 ? 26 : 18;
                  int ox = q == 1 ? -bw2 - 3 : (q == 3 ? 4 : -bw2 / 2);  // keep the number beside the long tick
                  id(f_strt)(lx + ox, ly - 9, bw2, 18, 0, 65535, 1, lb[q]);
                }
              }
              // "now" needle across the dial
              auto now = id(ha_time).now();
              if (now.is_valid() && !v.empty()) {
                float a = (now.hour * 60 + now.minute) / 1440.0f;
                float d = 1.0f / (r3o * 6.2832f);
                for (int k = -3; k <= 3; k++) rad(a + k * d, r3i - 2, r3o + 4, (k == -3 || k == 3) ? tick : 65535);
              }
              // centre: savings percent, as big as the hole allows
              int hole = r1i - 1;
              char b[16];
              if (ok) snprintf(b, sizeof(b), "%.0f%%", pct); else snprintf(b, sizeof(b), "--");
              std::string ct = b;
              int chh = std::min(2 * hole - 4, 60);
              bool centre = hole >= 14 && id(f_fit)(ct, 2 * hole - 6, chh, 3) >= 1;
              if (centre) id(f_strt)(cx - hole, cy - chh / 2, 2 * hole, chh, id(f_fit)(ct, 2 * hole - 6, chh, 3), 65535, 1, ct);
              // legend: one font size for all rows (the largest that fits every row)
              char l1[24], l2[24], l3[24];
              snprintf(l1, sizeof(l1), "Tani %.0f%%", tot > 0 ? sP * 100 / tot : 0.0f);
              snprintf(l2, sizeof(l2), "Średni %.0f%%", tot > 0 ? sA * 100 / tot : 0.0f);
              snprintf(l3, sizeof(l3), "Drogi %.0f%%", tot > 0 ? sB * 100 / tot : 0.0f);
              // 4th row: savings % when the centre is too small, else this month in PLN
              std::string m4 = !centre && ok ? std::string("Taniej o ") + ct : (mon.empty() ? "" : "+" + mon + " zł/mies.");
              if (side) {
                int lx = X + 2 * R + 10, lw = X + W - lx;
                int n = (m4.empty() || 2 * R < 4 * 26) ? 3 : 4;
                auto legf = [&](int rows) {
                  int rh = std::min(40, 2 * R / rows), f = 2;
                  f = std::min(f, id(f_fit)(l1, lw, rh, 2));
                  f = std::min(f, id(f_fit)(l2, lw, rh, 2));
                  f = std::min(f, id(f_fit)(l3, lw, rh, 2));
                  if (rows == 4) f = std::min(f, id(f_fit)(m4, lw, rh, 2));
                  return f;
                };
                // the 4th row may not shrink the others (unless it carries the savings %)
                if (n == 4 && centre && legf(4) < legf(3)) n = 3;
                int rowh = std::min(40, 2 * R / n);
                int lf = legf(n);
                int ly = cy - n * rowh / 2;
                id(f_strt)(lx, ly, lw, rowh, lf, cP, 0, l1);
                id(f_strt)(lx, ly + rowh, lw, rowh, lf, cA, 0, l2);
                id(f_strt)(lx, ly + 2 * rowh, lw, rowh, lf, cB, 0, l3);
                if (n == 4) id(f_strt)(lx, ly + 3 * rowh, lw, rowh, lf, cS, 0, m4);
              } else if (below) {
                int ly = cy + R + 2, cwid = W / 3;
                char a1[8], a2[8], a3[8];
                snprintf(a1, sizeof(a1), "%.0f%%", sP * 100 / tot);
                snprintf(a2, sizeof(a2), "%.0f%%", sA * 100 / tot);
                snprintf(a3, sizeof(a3), "%.0f%%", sB * 100 / tot);
                int lf = std::min(id(f_fit)(std::string(a2), cwid - 4, 28, 2), id(f_fit)(std::string(a1), cwid - 4, 28, 2));
                id(f_strt)(X, ly, cwid, 28, lf, cP, 1, a1);
                id(f_strt)(X + cwid, ly, cwid, 28, lf, cA, 1, a2);
                id(f_strt)(X + 2 * cwid, ly, W - 2 * cwid, 28, lf, cB, 1, a3);
              }
            };
            // ---------------- house tile ----------------
            // layout tile "V" with opt2 == "dom" (editor type "Dom")
            // state (sensor.panel_dom_dane): "t_in;t_roof;power_W;power_max_W"
            // climate values come from the klima action (k_* globals)
            // look: sky background, solid dark house with a thick outline, two unified
            // value sizes (indoor + climate big, roof + power second) for elderly users
            id(f_dtile) = [](int i, int x, int y, int w, int h) {
              const std::string &s = id(lt_s)[i];
              auto fld = [&s](int n) -> std::string {
                size_t p = 0;
                for (int k = 0; k < n; k++) {
                  p = s.find(';', p);
                  if (p == std::string::npos) return "";
                  p++;
                }
                size_t e = s.find(';', p);
                return s.substr(p, e == std::string::npos ? std::string::npos : e - p);
              };
              auto num = [](const std::string &v, float &out) -> bool {
                char *end = nullptr;
                out = strtof(v.c_str(), &end);
                return !v.empty() && end != v.c_str();
              };
              // one decimal only when the source has one (and it fits in 4 chars)
              auto tfmt = [](float v, const std::string &src) -> std::string {
                char b[16];
                snprintf(b, sizeof(b), src.find('.') != std::string::npos ? "%.1f" : "%.0f", v);
                if (strlen(b) > 4) snprintf(b, sizeof(b), "%.0f", v);
                return std::string(b) + "°";
              };
              // temperature colour (bright, readable on the sky)
              auto tcol = [](float v) -> int {
                if (v < 5) return id(f_rgb)(90, 160, 255);
                if (v < 18) return id(f_rgb)(80, 210, 245);
                if (v < 24) return id(f_rgb)(80, 220, 110);
                if (v < 28) return id(f_rgb)(255, 180, 30);
                return id(f_rgb)(255, 80, 50);
              };
              float tin = 0, troof = 0, pw = 0, pmax = 2700, tmp = 0;
              bool hin = num(fld(0), tin), hroof = num(fld(1), troof), hpw = num(fld(2), pw);
              if (num(fld(3), tmp) && tmp > 0) pmax = tmp;
              bool koff = id(k_id).empty() || id(k_st) == "off";
              int kc = koff ? id(f_rgb)(130, 136, 150) : id(f_hvc)(id(k_st));
              int DIM = id(f_rgb)(170, 176, 190);
              // background + 6 px climate bar
              id(f_skyfill)(x, y, w, h);
              id(f_fill)(x, y, w, 6, kc);
              int pad = w >= 120 ? 8 : 5;
              // ground = power bar along the whole tile bottom
              int gh = h >= 120 ? 10 : 8, gy = y + h - gh - 5, gx = x + pad, gw = w - 2 * pad;
              float frac = hpw ? pw / pmax : 0;
              frac = frac < 0 ? 0 : (frac > 1 ? 1 : frac);
              id(f_fill)(gx, gy, gw, gh, id(f_mix)(id(f_skyy)(gy), 0, 0.6f));
              int fw = (int) (gw * frac + 0.5f);
              for (int sx = 0; sx < fw; sx += 6) {
                int sw = std::min(6, fw - sx);
                id(f_fill)(gx + sx, gy, sw, gh, id(f_heat)((sx + sw * 0.5f) / gw));
              }
              bool wide = w >= h * 1.3f;
              int top = y + 10, bottom = gy - 3;
              int hw, hh, hx, hy, ix, iy, iw, ih;
              if (wide) {
                hh = bottom - top;
                hw = std::min((int) (hh * 1.35f), (w - 2 * pad) * 60 / 100);
                hx = x + pad; hy = top;
                ix = hx + hw + 8; iy = top; iw = x + w - pad - ix; ih = hh;
              } else {
                hw = w - 2 * pad;
                hh = std::min((int) (hw * 0.95f), (bottom - top) * 58 / 100);
                hx = x + pad; hy = top;
                ix = x + pad; iy = hy + hh + 4; iw = w - 2 * pad; ih = bottom - iy;
              }
              int rc = hroof ? tcol(troof) : DIM, wc = hin ? tcol(tin) : DIM;
              int lw = hw >= 110 ? 5 : 4;
              int lwi = 4;                                              // wall outline                               // outline thickness
              int hb = hy + hh, rh = std::max(20, hh * 42 / 100);
              int ax = hx + hw / 2, ay = hy, ey = hy + rh;
              int wl = hx + hw * 6 / 100, wr = hx + hw - hw * 6 / 100;
              int dark = id(f_mix)(id(f_skyy)((hy + hb) / 2), 0, 0.5f);
              // solid house: roof triangle + walls in a dark tone, then thick outline
              for (int ry = ay + 2; ry < ey; ry += 2) {
                int half = (int) ((float) (ry - ay) / (ey - ay) * (hw / 2.0f));
                if (half > 0) id(f_fill)(ax - half, ry, 2 * half, 2, dark);
              }
              id(f_fill)(wl, ey, wr - wl, hb - ey, dark);
              int cxp = hx + hw * 70 / 100, chw = std::max(8, hw / 11);
              int roofy = ay + (int) ((float) (cxp - ax) / (hw / 2.0f) * (ey - ay));
              id(f_fill)(cxp, roofy - rh * 45 / 100, chw, rh * 45 / 100 + 3, rc);
              for (int k = 0; k < lw; k++) {
                id(f_line)(hx, ey - k, ax, ay + lw - 1 - k, rc);
                id(f_line)(hx + hw - 1, ey - k, ax, ay + lw - 1 - k, rc);
              }
              id(f_fill)(wl, ey, lwi, hb - ey, wc);
              id(f_fill)(wr - lwi, ey, lwi, hb - ey, wc);
              id(f_fill)(wl, hb - lwi, wr - wl, lwi, wc);
              // text boxes
              std::string vroof = hroof ? tfmt(troof, fld(1)) : std::string("--");
              std::string vin = hin ? tfmt(tin, fld(0)) : std::string("--");
              int rbw = hw * 60 / 100, rbh = rh * 58 / 100, rby = ey - rbh - 1;
              int ibx = wl + lwi + 1, ibw = wr - wl - 2 * lwi - 2, iby = ey + 2, ibh = hb - lwi - 2 - iby;
              int lab = ibh >= 90 ? 26 : 0;                            // "W domu" label when there is room
