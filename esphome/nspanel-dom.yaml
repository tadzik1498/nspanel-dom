              for (int k = 0; k < n; k++) {
                int cx = X + 8 + ((n == 2) ? k * span / 2 : k * span / (n - 1));
                int cy = Y + 14 + (k % 2) * 2;
                id(f_circ)(cx, cy + 6, 10, cc);
                id(f_circ)(cx + 14, cy, 13, cc);
                id(f_circ)(cx + 28, cy + 6, 10, cc);
                id(f_fill)(cx, cy + 6, 28, 10, cc);
              }
              if (g == 5) {
                int cy = id(f_rgb)(255, 230, 80);
                for (int bx : {X + W / 3, X + 2 * W / 3}) {
                  id(f_line)(bx, Y + 22, bx - 4, Y + 27, cy); id(f_line)(bx - 4, Y + 27, bx + 1, Y + 27, cy); id(f_line)(bx + 1, Y + 27, bx - 4, Y + 33, cy);
                }
              }
            };
            id(f_wname) = [](const std::string &c) -> std::string {
              static const char *k[] = {"sunny", "clear-night", "partlycloudy", "cloudy", "fog", "rainy", "pouring", "hail", "snowy", "snowy-rainy", "lightning", "lightning-rainy", "windy", "windy-variant", "exceptional"};
              static const char *v[] = {"Słonecznie", "Pogodnie", "Małe zachmurzenie", "Pochmurno", "Mgła", "Deszcz", "Ulewa", "Grad", "Śnieg", "Śnieg z deszczem", "Burza", "Burza z deszczem", "Wietrznie", "Wietrznie", "Uwaga - pogoda"};
              for (int i = 0; i < 15; i++) if (c == k[i]) return v[i];
              return c;
            };
            // n-th field of "a|b|c"
            id(f_fld) = [](const std::string &s, int n) -> std::string {
              size_t st = 0;
              for (int k = 0; k < n; k++) {
                size_t p = s.find('|', st);
                if (p == std::string::npos) return "";
                st = p + 1;
              }
              size_t e = s.find('|', st);
              return s.substr(st, e == std::string::npos ? std::string::npos : e - st);
            };
            // small weather icon centered at cx,cy (about 24 x 20 px)
            id(f_micon) = [](int cx, int cy, const std::string &c, int bg) {
              int g = id(f_grp)(c);
              int sun = id(f_rgb)(255, 210, 80), cl = id(f_rgb)(190, 195, 205), dk = id(f_rgb)(120, 126, 140);
              if (c == "clear-night") { id(f_circ)(cx, cy, 7, id(f_rgb)(235, 232, 210)); id(f_circ)(cx + 4, cy - 3, 6, bg); return; }
              if (g == 0) { id(f_circ)(cx, cy, 7, sun); return; }
              if (g == 1 || g == 7) id(f_circ)(cx + 5, cy - 4, 6, sun);
              int cc = (g == 4 || g == 5 || g == 6) ? dk : cl;
              id(f_circ)(cx - 6, cy + 2, 5, cc);
              id(f_circ)(cx, cy - 2, 7, cc);
              id(f_circ)(cx + 6, cy + 2, 5, cc);
              id(f_fill)(cx - 6, cy + 2, 12, 5, cc);
              if (g == 4) { int b = id(f_rgb)(120, 170, 255); id(f_line)(cx - 4, cy + 9, cx - 6, cy + 13, b); id(f_line)(cx + 3, cy + 9, cx + 1, cy + 13, b); }
              if (g == 6) { int w = id(f_rgb)(240, 245, 255); id(f_circ)(cx - 4, cy + 11, 1, w); id(f_circ)(cx + 3, cy + 11, 1, w); }
              if (g == 5) { int y = id(f_rgb)(255, 220, 60); id(f_line)(cx, cy + 7, cx - 3, cy + 11, y); id(f_line)(cx - 3, cy + 11, cx + 1, cy + 11, y); id(f_line)(cx + 1, cy + 11, cx - 2, cy + 15, y); }
              if (g == 3) { int f = id(f_rgb)(200, 205, 210); id(f_line)(cx - 8, cy + 10, cx + 8, cy + 10, f); id(f_line)(cx - 6, cy + 13, cx + 6, cy + 13, f); }
