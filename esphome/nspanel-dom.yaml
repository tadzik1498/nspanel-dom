# ---------------- NSPanel hardware ----------------
switch:
  - platform: gpio
    id: screen_power
    name: Zasilanie ekranu
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON
  - platform: template
    id: sw_gong
    name: Gong co godzinę
    icon: mdi:bell-ring-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_kor
    name: "Korytarz: okno po włączeniu"
    icon: mdi:lightbulb-on-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_przyp
    name: Przypomnienie o świetle
    icon: mdi:lightbulb-alert
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    id: relay_1
    name: Przekaźnik 1
    pin: 22
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_2
    name: Przekaźnik 2
    pin: 19
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    id: btn_left
    name: Przycisk lewy
    pin:
      number: 14
      inverted: true
    on_click:
      - switch.toggle: relay_1
  - platform: gpio
    id: btn_right
    name: Przycisk prawy
    pin:
      number: 27
      inverted: true
    on_click:
      - switch.toggle: relay_2

sensor:
  - platform: wifi_signal
    name: WiFi
    update_interval: 60s
    entity_category: diagnostic
  - platform: adc
    id: ntc_source
    pin: 38
    update_interval: 10s
    attenuation: 12db
  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
  - platform: ntc
    id: temperature
    sensor: resistance_sensor
    name: Temperatura
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6

number:
  - platform: template
    id: n_gain
    name: Głośność pipczyka
    icon: mdi:volume-high
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 60
  - platform: template
    id: n_gong_od
    name: Gong od godziny
    icon: mdi:bell-clock
    entity_category: config
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 8
  - platform: template
    id: n_gong_do
    name: Gong do godziny
    icon: mdi:bell-clock-outline
    entity_category: config
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 21
  - platform: template
    id: n_p_po
    name: Przypomnienie po
    icon: mdi:timer-alert-outline
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 240
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    id: n_p_co
    name: Przypomnienie co
    icon: mdi:timer-refresh-outline
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    id: n_kor_zgas
    name: "Korytarz: zgaś po"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
  - platform: template
    id: n_kor_okno
    name: "Korytarz: okno widoczne"
    icon: mdi:message-badge-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 3
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 10
  - platform: template
    id: n_p_mrug
    name: Przypomnienie mruganie
    icon: mdi:flash-alert
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    id: n_p_czas
    name: Przypomnienie wyświetlaj
    icon: mdi:message-alert-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 60
  - platform: template
    name: Jasność ekranu
    icon: mdi:brightness-7
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    update_interval: 5s
    lambda: 'return id(p_bright);'
    set_action:
      - lambda: |-
          id(p_bright) = (int) x;
          if (!id(g_dimmed)) id(disp).set_backlight_brightness(x / 100.0f);
  - platform: template
    name: Jasność przyciemniona
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    update_interval: 5s
    lambda: 'return id(p_dim);'
    set_action:
      - lambda: |-
          id(p_dim) = (int) x;
          if (id(g_dimmed)) id(disp).set_backlight_brightness(x / 100.0f);
  - platform: template
    name: Widoczna szerokość ekranu
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    unit_of_measurement: px
    min_value: 400
    max_value: 480
    step: 2
    mode: box
    update_interval: 5s
    lambda: 'return id(p_uiw);'
    set_action:
      - lambda: |-
          id(p_uiw) = (int) x;
          id(f_draw)();
  - platform: template
    name: Przyciemnienie po
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 1800
    step: 10
    mode: box
    update_interval: 5s
    lambda: 'return id(p_dim_s);'
    set_action:
      - lambda: 'id(p_dim_s) = (int) x;'

select:
  - platform: template
    id: sel_gong
    name: Melodia gongu
    icon: mdi:music-note
    entity_category: config
    options: ["Krótki", "Podwójny", "Kuranty", "Westminster"]
    initial_option: "Podwójny"
    optimistic: true
    restore_value: true
  - platform: template
    id: sel_p_poz
    name: Przypomnienie poziom
    icon: mdi:alert-circle-outline
    entity_category: config
    options: ["Informacja", "Ostrzeżenie", "Alarm"]
    initial_option: "Ostrzeżenie"
    optimistic: true
    restore_value: true
  - platform: template
    id: sel_p_dzw
    name: Przypomnienie dźwięk
    icon: mdi:bell-alert-outline
    entity_category: config
    options: ["Brak", "Krótki", "Podwójny", "Ostrzeżenie", "Alarm"]
    initial_option: "Podwójny"
    optimistic: true
    restore_value: true

text:
  - platform: template
    id: txt_p_enc
    name: Przypomnienie encje
    icon: mdi:lightbulb-alert-outline
    entity_category: config
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""

output:
  - platform: ledc
    id: buzzer_out
    pin: 21

rtttl:
  id: buzzer
  output: buzzer_out

button:
  - platform: template
    name: Wgraj TFT
    entity_category: config
    on_press:
      - lambda: 'id(disp).upload_tft();'
  - platform: template
    name: Synchronizuj z HA
    on_press:
      - script.execute:
          id: ha_event
          what: sync
  - platform: template
    name: Reset wyboru encji
    entity_category: config
    on_press:
      - lambda: |-
          for (int k = 0; k < 64; k++) id(p_sel)[k] = 0;
          for (int k = 0; k < 32; k++) { id(p_mve)[k] = 0; id(p_mva)[k] = 0; }
          ESP_LOGI("dom", "Selection reset");
      - script.execute:
          id: ha_event
          what: sync
  - platform: template
    name: Test gongu
    icon: mdi:bell-ring
    entity_category: config
    on_press:
      - lambda: 'id(f_sound)(id(sel_gong).current_option().str());'
  - platform: template
    name: Test wiadomości
    icon: mdi:message-text
    entity_category: config
    on_press:
      - lambda: |-
          id(m_title) = "Test wiadomości";
          id(m_text) = "To jest przykładowa wiadomość z Home Assistant. Dotknij OK, aby zamknąć.";
          id(m_lvl) = 0; id(m_btn2) = ""; id(m_id) = "test"; id(m_on) = true;
          id(m_until) = 0; id(m_flash_until) = millis() + 3000; id(g_dimmed) = false; id(t_last) = millis();
          id(f_sound)("Krótki");
          id(f_draw)();
  - platform: restart
    name: Restart
    entity_category: config
